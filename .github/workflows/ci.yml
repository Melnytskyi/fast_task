name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.arch }} / ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            config: Debug
            build_type: Debug
            cmake_args: ""
          - os: ubuntu-latest
            arch: x64
            config: Release
            build_type: Release
            cmake_args: ""
          - os: ubuntu-latest
            arch: x64
            config: Shared
            build_type: Release
            cmake_args: "-DFAST_TASK_STATIC=OFF"
          - os: ubuntu-latest
            arch: x64
            config: DebugAPI
            build_type: Debug
            cmake_args: "-DFAST_TASK_ENABLE_DEBUG_API=ON"
          - os: ubuntu-latest
            arch: x64
            config: Preempt
            build_type: Release
            cmake_args: "-DFAST_TASK_ENABLE_PREEMPTIVE_SCHEDULER=ON"
          - os: ubuntu-latest
            arch: x64
            config: Clang-Debug
            build_type: Debug
            cmake_args: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
          - os: ubuntu-latest
            arch: x64
            config: Clang-Release
            build_type: Release
            cmake_args: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
          - os: ubuntu-latest
            arch: x64
            config: Clang-ASan-UBSan
            build_type: Debug
            cmake_args: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined\\ -fno-omit-frame-pointer -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          - os: ubuntu-latest
            arch: x64
            config: Clang-TSan
            build_type: Debug
            cmake_args: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-fsanitize=thread\\ -fno-omit-frame-pointer -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread"
          - os: ubuntu-latest
            arch: x64
            config: Module
            build_type: Release
            cmake_args: "-DFAST_TASK_BUILD_MODULE=ON"
          - os: ubuntu-24.04-arm
            arch: arm64
            config: Debug
            build_type: Debug
            cmake_args: ""
          - os: ubuntu-24.04-arm
            arch: arm64
            config: Release
            build_type: Release
            cmake_args: ""
          - os: ubuntu-24.04-arm
            arch: arm64
            config: Preempt
            build_type: Release
            cmake_args: "-DFAST_TASK_ENABLE_PREEMPTIVE_SCHEDULER=ON"

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config liburing-dev libc-ares-dev libboost-context-dev clang

      - name: Check scheduler layer includes
        run: bash scripts/check_layers.sh

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DFAST_TASK_BUILD_TESTS=ON
          -DFAST_TASK_DISABLE_IO_TESTS=OFF
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --parallel 4 --timeout 60 --output-on-failure

  windows:
    name: Windows (${{ matrix.arch }} / ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            config: Debug
            build_type: Debug
            cmake_args: ""
          - os: windows-latest
            arch: x64
            config: Release
            build_type: Release
            cmake_args: ""
          - os: windows-latest
            arch: x64
            config: Preempt
            build_type: Release
            cmake_args: "-DFAST_TASK_ENABLE_PREEMPTIVE_SCHEDULER=ON"
          - os: windows-latest
            arch: x64
            config: ClangCL-Debug
            build_type: Debug
            cmake_args: "-T ClangCL"
          - os: windows-latest
            arch: x64
            config: ClangCL-Release
            build_type: Release
            cmake_args: "-T ClangCL"
          - os: windows-latest
            arch: x64
            config: ASan
            build_type: RelWithDebInfo
            cmake_args: '-DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /EHsc /Zi /fsanitize=address"'
            timeout: 30
          - os: windows-latest
            arch: x64
            config: ClangCL-UBSan
            build_type: RelWithDebInfo
            cmake_args: '-T ClangCL -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /EHsc -fsanitize=undefined"'
            timeout: 30
          - os: windows-11-arm
            arch: arm64
            config: Debug
            build_type: Debug
            cmake_args: ""
          - os: windows-11-arm
            arch: arm64
            config: Release
            build_type: Release
            cmake_args: ""
          - os: windows-11-arm
            arch: arm64
            config: Preempt
            build_type: Release
            cmake_args: "-DFAST_TASK_ENABLE_PREEMPTIVE_SCHEDULER=ON"

    steps:
      - uses: actions/checkout@v7

      - name: Configure CMake
        run: >
          cmake -B build
          -DFAST_TASK_BUILD_TESTS=ON
          -DFAST_TASK_DISABLE_IO_TESTS=OFF
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if ($vsPath) {
            $asanDirs = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Recurse -Filter "clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty DirectoryName -Unique
            foreach ($d in $asanDirs) { $env:PATH = "$d;$env:PATH" }
          }
          ctest --test-dir build -C ${{ matrix.build_type }} --parallel 4 --timeout ${{ matrix.timeout || 14 }} --output-on-failure
